version: "3.9"

services:
  rag-chatbot:
    build: .
    container_name: rag_chatbot
    ports:
      - "7000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434  # internal docker hostname

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11500:11434"  # <--- host:container mapping (host port changed)
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
